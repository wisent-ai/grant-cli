[package]
name = "grant-cli"
version = "0.1.0"
edition = "2024"
description = "Grant research, authoring, evidence, and export workspace on the Wisent fleet database"
license-file = "LICENSE"
repository = "https://github.com/wisent-ai/grant-cli"

[[test]]
name = "db"
path = "tests/db/lifecycle.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
dirs = "6.0.0"
pdf-extract = "0.12.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
scraper = "0.27.0"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
stado-database = { git = "https://github.com/wisent-ai/stado", package = "stado-database" }
tokio = { version = "1", features = ["rt"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
zip = "8.6.0"
