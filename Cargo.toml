[package]
name = "grant-cli"
version = "0.1.0"
edition = "2024"
description = "Local-first grant research, authoring, evidence, and export workspace"
license-file = "LICENSE"
repository = "https://github.com/wisent-ai/grant-cli"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
dirs = "6.0.0"
pdf-extract = "0.12.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
zip = "8.6.0"
